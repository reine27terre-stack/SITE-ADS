<style>

@media(prefers-color-scheme:light){:root{--bg:#f0f4fa;--sidebar:rgba(255,255,255,.96);--card:rgba(255,255,255,.92);--hdr:rgba(240,244,250,.92);--ink:#0f172a;--mut:#5a6d82;--line:rgba(120,140,170,.18);--acc:#0284c7;--acc2:#6366f1;--fg:#fff;--warn:#d97706;--bad:#e11d48;--ok:#059669;--in:rgba(255,255,255,.9);--sh:0 6px 24px rgba(15,23,42,.06),0 1px 4px rgba(15,23,42,.04);--glow:rgba(2,132,199,.04);--glow2:rgba(99,102,241,.04)}}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{min-height:100vh;color:var(--ink);font:15px/1.65 Inter,system-ui,-apple-system,sans-serif;background:var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}

@keyframes bgShift{0%{opacity:.85}50%{opacity:1}100%{opacity:.85}}

/* Layout */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:260px;flex-shrink:0;background:var(--sidebar);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:10}
.side-brand{display:flex;align-items:center;gap:14px;padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.side-brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 16px rgba(56,189,248,.3),0 0 0 1px rgba(255,255,255,.1) inset;animation:logoPulse 4s ease-in-out infinite;position:relative}
.side-brand .logo::after{content:'';position:absolute;inset:-3px;border-radius:14px;background:linear-gradient(135deg,rgba(56,189,248,.4),rgba(129,140,248,.4));z-index:-1;filter:blur(8px);opacity:.5}
@keyframes logoPulse{0%,100%{box-shadow:0 4px 16px rgba(56,189,248,.3),0 0 0 1px rgba(255,255,255,.1) inset}50%{box-shadow:0 4px 24px rgba(56,189,248,.45),0 0 0 1px rgba(255,255,255,.15) inset}}
.side-brand .b-name{font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.side-brand .b-sub{font-size:11.5px;color:var(--mut);font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.side-nav{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:3px;scrollbar-width:none}
.side-nav::-webkit-scrollbar{display:none}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;color:var(--mut);border:1px solid transparent;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:none;transition:all .2s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.side-nav button::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:0;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--acc),var(--acc2));transition:height .2s cubic-bezier(.16,1,.3,1);opacity:0}
.side-nav button:hover{color:var(--ink);background:rgba(56,189,248,.06);transform:translateX(3px)}
.side-nav button.on{color:var(--ink);background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(129,140,248,.08));border-color:rgba(56,189,248,.2);font-weight:700;box-shadow:0 2px 12px rgba(56,189,248,.08)}
.side-nav button.on::before{height:22px;opacity:1}
.side-user{padding:16px 16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,transparent,rgba(56,189,248,.03))}
.user-row{display:flex;align-items:center;gap:12px}
.user-av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(56,189,248,.25)}
.user-meta{flex:1;min-width:0}
.user-meta .u-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main-content{flex:1;min-width:0;display:flex;flex-direction:column}
.mobile-hdr{display:none}
main{max-width:940px;width:100%;margin:0 auto;padding:32px 28px 80px;animation:rise .4s cubic-bezier(.16,1,.3,1)}

/* Mobile */
@media(max-width:799px){
  .app-layout{flex-direction:column}
  .sidebar{display:none}
  .mobile-hdr{position:sticky;top:0;z-index:10;display:flex;flex-direction:column;background:var(--hdr);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid var(--line);padding:12px 16px 8px}
  .mob-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:8px}
  .mob-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:100%;padding-bottom:4px}
  .mob-nav::-webkit-scrollbar{display:none}
  .mob-nav button{background:none;color:var(--mut);border:1px solid transparent;padding:7px 14px;border-radius:99px;white-space:nowrap;box-shadow:none;font-size:13px;font-weight:500;transition:all .15s ease}
  .mob-nav button.on{color:var(--ink);background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(129,140,248,.08));border-color:rgba(56,189,248,.25);font-weight:700}

/* Typography */
h1,h2,h3{letter-spacing:-.03em;line-height:1.25}
h2{margin:.2em 0 .9em;font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--ink),var(--mut));-webkit-background-clip:text;background-clip:text}
h3{margin:1.4em 0 .7em;font-size:15px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.03em}

/* Buttons */
button{font:inherit;font-weight:600;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--fg);border:0;border-radius:11px;padding:10px 20px;cursor:pointer;transition:all .2s cubic-bezier(.16,1,.3,1);box-shadow:0 4px 16px rgba(56,189,248,.2),0 0 0 1px rgba(255,255,255,.06) inset;position:relative;overflow:hidden}
button::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 50%);pointer-events:none;opacity:1;transition:opacity .2s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,.3),0 0 0 1px rgba(255,255,255,.1) inset}
button:active{transform:translateY(0);box-shadow:0 2px 8px rgba(56,189,248,.2)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.ghost::after{display:none}
button.ghost:hover{background:rgba(56,189,248,.06);border-color:rgba(56,189,248,.25);box-shadow:0 2px 12px rgba(56,189,248,.08);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Inputs */
input,select,textarea{font:inherit;width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:var(--in);color:var(--ink);transition:all .2s cubic-bezier(.16,1,.3,1)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.1),0 4px 16px rgba(56,189,248,.06);outline:none}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.6}
label{display:block;margin:0 0 16px;color:var(--mut);font-size:13.5px;font-weight:600;letter-spacing:.01em}label input,label select,label textarea{margin-top:7px}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 16px;box-shadow:var(--sh);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);transition:all .25s cubic-bezier(.16,1,.3,1);position:relative}
.card::before{content:'';position:absolute;inset:0;border-radius:18px;background:linear-gradient(135deg,var(--glow),var(--glow2));pointer-events:none;opacity:0;transition:opacity .25s}
.card:hover{border-color:rgba(56,189,248,.18);transform:translateY(-1px);box-shadow:var(--sh),0 0 40px rgba(56,189,248,.04)}
.card:hover::before{opacity:1}

.row{display:flex;gap:14px;align-items:flex-end}.row>*{flex:1}.row button{flex:0 0 auto;margin-bottom:16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts select{width:auto}
.mut{color:var(--mut)}.pre{white-space:pre-wrap;word-break:break-word}
code{background:var(--in);padding:4px 10px;border-radius:8px;font-size:12.5px;word-break:break-all;border:1px solid var(--line);font-family:'SF Mono',Consolas,monospace}
details summary{cursor:pointer;font-weight:600;transition:color .15s}
details summary:hover{color:var(--acc)}
details>*:not(summary){margin-top:12px}

/* Tags */
.tag{font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--in);display:inline-flex;align-items:center;gap:4px;letter-spacing:.01em}
.tag.ok{color:var(--ok);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.tag.no{color:var(--bad);border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.08)}
.tag.attente,.tag.form{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.tag.rank{color:var(--acc);border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.06)}

/* Hero */
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:30px 32px;border-radius:22px;border:1px solid rgba(56,189,248,.2);background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(129,140,248,.08));margin-bottom:20px;box-shadow:var(--sh),0 0 60px rgba(56,189,248,.04) inset}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 300px 200px at 80% 20%,rgba(56,189,248,.1),transparent);pointer-events:none;animation:heroGlow 6s ease-in-out infinite alternate}
@keyframes heroGlow{0%{opacity:.5}100%{opacity:1}}
.hero::after{content:'🛡️';position:absolute;right:16px;top:-12px;font-size:140px;opacity:.04;pointer-events:none;filter:blur(1px)}
.hero h1{margin:.1em 0;font-size:34px;font-weight:900;letter-spacing:-.03em;position:relative}
.hero p{margin:0;position:relative}
.pts{text-align:center;z-index:1;background:rgba(8,14,28,.5);padding:14px 24px;border-radius:16px;border:1px solid rgba(56,189,248,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pts b{display:block;font-size:42px;font-weight:900;line-height:1;background:linear-gradient(135deg,#38bdf8,#818cf8,#c084fc);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ptShine 4s ease-in-out infinite}
@keyframes ptShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.pts span{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);transition:all .2s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.stats div::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));opacity:.5;border-radius:16px 16px 0 0}
.stats div:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.2);box-shadow:var(--sh),0 0 30px rgba(56,189,248,.05)}
.stats i{font-style:normal;font-size:24px}
.stats b{display:block;font-size:28px;font-weight:900;line-height:1.2;margin:6px 0 2px}
.stats span{color:var(--mut);font-size:12.5px;font-weight:500}

/* Notes */
.note{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;padding:14px 18px;background:var(--card);font-size:14px;line-height:1.6}
.flash{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.12),0 0 20px rgba(56,189,248,.06)}
.log{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
fieldset{border:0;padding:0;margin:0 0 14px}legend{font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:center;margin:0 0 8px;color:var(--ink);cursor:pointer;font-size:14px}.opt input{width:auto;margin:0;accent-color:var(--acc)}
.chip{padding:7px 16px;border:1px solid var(--line);border-radius:99px;background:var(--in);margin:0;font-size:13px;transition:all .15s ease}
.chip:hover{border-color:rgba(56,189,248,.25);background:rgba(56,189,248,.04)}

/* Rich content */
.rich img,.rich video{max-width:100%;border-radius:14px;display:block;margin:10px 0}.rich iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}.rich figure{margin:14px 0}.rich figcaption{font-size:13px;color:var(--mut)}.rich p{margin:.5em 0}.rich a{color:var(--acc);text-decoration:none;border-bottom:1px solid rgba(56,189,248,.3);transition:border-color .15s}.rich a:hover{border-color:var(--acc)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;max-width:none;margin:0}
.glass{width:100%;max-width:400px;text-align:center;background:var(--card);border:1px solid rgba(56,189,248,.2);border-radius:28px;padding:40px 30px;box-shadow:var(--sh),0 0 80px rgba(56,189,248,.06);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:-2px;border-radius:30px;background:conic-gradient(from 0deg,var(--acc),var(--acc2),rgba(192,132,252,.5),var(--acc));padding:2px;z-index:-1;animation:borderSpin 6s linear infinite;opacity:.3}
@keyframes borderSpin{to{filter:hue-rotate(360deg)}}
.glass .logo.big{font-size:52px;margin-bottom:8px;filter:drop-shadow(0 4px 16px rgba(56,189,248,.3));animation:loginPulse 3s ease-in-out infinite}
@keyframes loginPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.glass h1{margin:.1em 0 .3em;font-size:30px;font-weight:900}
.glass label{text-align:left}
.glass button{width:100%;margin-top:12px;padding:13px;font-size:15px}
.bad{color:var(--bad)}

/* Toast */
#t{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(10,16,30,.92);color:var(--ink);border:1px solid rgba(56,189,248,.3);padding:12px 26px;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04) inset;backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.16,1,.3,1);max-width:90vw;z-index:99;font-weight:600;font-size:14px}
#t.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:560px){.row{flex-direction:column;align-items:stretch}.row button{margin-bottom:0}.hero{flex-direction:column;align-items:flex-start}}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,150,190,.2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,150,190,.35)}

/* Selection */
::selection{background:rgba(56,189,248,.25);color:var(--ink)}

/* List style */
ul{padding-left:18px;margin:.5em 0}
li{margin:4px 0;font-size:14px;line-height:1.55}
li::marker{color:var(--acc)}

function rich(t){return String(t||'').split('\n').map(l=>{l=l.trim();if(!l)return'';let m;
 if(m=/^(image|video|lien)\s*:\s*(\S+)(?:\s*\|\s*(.*))?$/i.exec(l)){const k=m[1].toLowerCase(),u=m[2],cap=m[3]?`<figcaption class="mut">${e(m[3])}</figcaption>`:'';
  if(!okU(u))return`<p class="mut">Lien non autorisé : ${e(u)}</p>`;
  if(k=='image')return`<figure><img loading="lazy" src="${e(u)}" alt="${e(m[3]||'')}">${cap}</figure>`;
  if(k=='lien')return`<p><a href="${e(u)}" target="_blank" rel="noopener noreferrer">${e(m[3]||u)}</a></p>`;
  const y=yt(u);return`<figure>${y?`<iframe src="https://www.youtube-nocookie.com/embed/${y}" allowfullscreen loading="lazy" referrerpolicy="no-referrer"></iframe>`:`<video controls preload="metadata" src="${e(u)}"></video>`}${cap}</figure>`}
 if(l.startsWith('## '))return`<h3>${e(l.slice(3))}</h3>`;return`<p>${e(l)}</p>`}).join('')}
const mt=v=>!q||String(v??'').toLowerCase().includes(q.toLowerCase());
function onSearch(inp){q=inp.value;const l=document.querySelector('.search-list');if(l&&PAGES[page+'_list'])l.innerHTML=PAGES[page+'_list']();else render()}
const SB=(ph)=>`<div class="card" style="padding:10px 14px"><input type="search" value="${e(q)}" placeholder="${e(ph)}" oninput="onSearch(this)"></div>`;
const tut=l=>{const t=S.cfg.tutos.find(x=>x.t.toLowerCase()==l.toLowerCase());return t?`<details class="card"><summary>Tutoriel : ${e(t.t)}</summary><div class="rich">${rich(t.b)}</div></details>`:''};
async function api(m,u,b,q){try{const r=await fetch('/api/'+u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json','x-ads':'1'},body:b?JSON.stringify(b):undefined}),j=await r.json();if(!r.ok){if(!q)toast(j.error||'Erreur');return null}if(j.S){S=j.S;me=j.me}return j}catch(x){if(!q)toast('Serveur injoignable');return null}}
function toast(m){const t=$('#t');t.textContent=m;t.className='on';clearTimeout(toast.k);toast.k=setTimeout(()=>t.className='',4000)}
async function login(ev){ev.preventDefault();const j=await api('POST','login',{code:$('#code').value.trim()},1);if(!j){$('#err').textContent='Code inconnu ou trop d’essais.';return}render();schedulePoll()}
async function logout(){clearTimeout(pollT);await api('POST','logout',{},1);S=null;me=null;flash=null;render()}
function go(p){page=p;fm=null;qid=null;flash=null;q='';render()}
async function act(m,u,b,ok){const j=await api(m,u,b);if(j){if(j.newCode)flash=j.newCode;render();if(ok)toast(ok)}return j}

<p class="mut">Le ${fd(r.date)}. Réalisé par ${e(r.by)}, supervisé par ${e(r.sup||'-')}.</p>

<div class="acts">

</div>
${isFormaOpen?`
<div class="card" style="margin-top:12px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:14px">

      <div class="acts" style="margin-top:8px">

</div>
`:''}</div>`};

const uCard=u=>`<div class="card"><div class="top"><b>${e(u.name)}</b><span class="tag rank">${e(u.rank)}</span>${u.rec?'<span class="tag">Recruteur</span>':''}<span class="tag">${tot(u)} pts</span></div>
${can('set')?`<div class="acts"><select onchange="setRank('${u.id}',this.value)">${S.cfg.ranks.map(r=>`<option${r==u.rank?' selected':''}>${e(r)}</option>`).join('')}</select><button class="ghost" onclick="newCode('${u.id}')">Nouveau code</button><button class="ghost" onclick="togRec('${u.id}')">Recruteur : ${u.rec?'retirer':'ajouter'}</button><button class="ghost" onclick="delU('${u.id}')">Supprimer</button></div>`:''}

${(u.weeks||[]).length?`<p class="mut">Semaines précédentes : ${u.weeks.slice(0,6).map(w=>fd(w.d)+' : '+w.t+' pts').join(', ')}</p>`:''}
${Object.keys(u.qz||{}).length?`<p class="mut">Quiz : ${Object.entries(u.qz).map(([k,v])=>e((S.cfg.quizzes.find(z=>z.id==k)||{t:k}).t)+' '+v).join(', ')}</p>`:''}
<ul>${u.pts.slice().reverse().slice(0,30).map(p=>`<li>${p.v>0?'+':''}${p.v} : ${e(p.w)} <span class="mut">(${e(p.by||'-')}, ${new Date(p.d).toLocaleDateString('fr-FR')})</span></li>`).join('')||'<li class="mut">Aucun point pour le moment.</li>'}</ul></div>`;

const PAGES={
dash(){const w=S.rcs.filter(r=>r.v=='attente').length,f=S.rcs.filter(r=>r.v=='ok'&&!r.tr);
 return `${warns()}<div class="hero"><div><span class="mut">Bienvenue</span><h1>${e(me.name)}</h1><p class="mut">${e(S.cfg.name)}</p></div><div class="pts"><b>${tot(myu())}</b><span>points</span></div></div>
${S.cfg.home?`<div class="card rich">${rich(S.cfg.home)}</div>`:''}${tut('Accueil')}
<div class="stats">${can('hg')||can('dec')?`<div><i>📥</i><b>${w}</b><span>candidatures en attente</span></div><div><i>🎓</i><b>${f.length}</b><span>en attente de formation</span></div>`:''}<div><i>📝</i><b>${S.crs.length}</b><span>comptes rendus</span></div><div><i>🏅</i><b>${e(me.rank)}</b><span>ton rang</span></div></div>
${(can('hg')||can('dec'))&&f.length?`<div class="note">En attente de formation : ${f.map(r=>e(r.cand)).join(', ')}</div><p></p>`:''}<p class="note">Les comptes rendus sont à rendre une fois par semaine, le samedi (dépôt ouvert dès le vendredi 23h59). Le classement se met à jour quand les comptes rendus sont clos et reste figé jusqu'au samedi d'après.${S.cfg.reset&&S.cfg.reset.on?' Remise à zéro des points des profils chaque dimanche à 00h00 (heure de '+e(S.cfg.reset.tz)+').':''}</p>`},
rc(){const today=new Date().toISOString().slice(0,10);let i=0;
 const qs=S.cfg.rq.map((l,j)=>l.startsWith('##')?`<h3>${e(l.replace(/^#+\s*/,''))}</h3>`:`<label>Question ${++i} : ${e(l)}<textarea name="a${j}" rows="2" placeholder="Réponse"></textarea></label>`).join('');
 return `<h2>Recrutement</h2>${tut('Recrutement')}<form class="card" onsubmit="addRc(event)"><h3>Nouvel entretien</h3><div class="row"><label>Candidat (pseudo)<input name="cand" required></label><label>ID Discord<input name="did" inputmode="numeric"></label></div><div class="row"><label>Date de l’entretien<input type="date" name="date" value="${today}"></label><label>Réalisé par<input name="by" value="${e(me.name)}"></label></div><label>Supervisé par<input name="sup"></label>${qs}<button>Enregistrer et envoyer le rapport d’entretien</button></form>
<div class="acts">${[['','Toutes'],['attente','En attente'],['ok','Acceptées'],['no','Refusées']].map(f=>`<button class="${rcf==f[0]?'':'ghost'}" onclick="rcf='${f[0]}';render()">${f[1]}</button>`).join('')}</div><p></p>${SB('Rechercher un candidat, un ID, un recruteur…')}<div class="search-list">${PAGES.rc_list()}</div>`},
rc_list(){return S.rcs.filter(r=>!rcf||r.v==rcf).filter(r=>mt(r.cand)||mt(r.did)||mt(r.by)||mt(r.sup)).map(rcRow).join('')||'<p class="mut">Aucun résultat.</p>'},
team(){const fl=flash?`<div class="card flash"><b>Code de ${e(flash.name)}</b><div class="top"><code>${e(flash.code)}</code><button type="button" class="ghost" onclick="cp('${e(flash.code)}')">Copier</button></div><p class="mut">Ce code n’est affiché qu’une seule fois : note-le et transmets-le en privé.</p></div>`:'';
 return `<h2>Profils</h2>${fl}${tut('Profils')}${SB('Rechercher un membre, un rang…')}${can('set')?`<form class="card" onsubmit="addU(event)"><h3>Nouveau compte</h3><div class="row"><label>Nom<input name="n" required></label><label>ID Discord<input name="did"></label></div><div class="row"><label>Rang<select name="rank">${(S.cfg.ranks.indexOf(me.rank)>=0?S.cfg.ranks.slice(0,S.cfg.ranks.indexOf(me.rank)+1):S.cfg.ranks).map(r=>`<option value="${e(r)}"${r=='Test'?' selected':''}>${e(r)}</option>`).join('')}</select></label><label>Code (vide = automatique, 8 caractères minimum)<input name="code" autocomplete="off"></label></div><label class="opt"><input type="checkbox" name="rec">Recruteur (peut faire des entretiens)</label><button>Créer le compte</button></form>`:''}
${can('pts')?`<form class="card" onsubmit="bulk(event)"><h3>Points en masse</h3><div class="row"><label>Points (négatif pour retirer)<input name="v" type="number" step="any" required></label><label>Motif ou mission<input name="w" required></label></div><p class="mut">Tous les membres d’un rang :</p><div class="acts">${S.cfg.ranks.map(r=>`<label class="opt chip"><input type="checkbox" name="rk" value="${e(r)}">${e(r)}</label>`).join('')}</div><p class="mut">Et/ou des membres précis :</p><div class="acts">${S.users.map(u=>`<label class="opt chip"><input type="checkbox" name="id" value="${u.id}">${e(u.name)}</label>`).join('')}</div><p></p><button>Ajouter les points aux personnes sélectionnées</button></form>`:''}<div class="search-list">${PAGES.team_list()}</div>`},
team_list(){return S.users.filter(u=>mt(u.name)||mt(u.rank)||mt(u.did)).map(uCard).join('')||'<p class="mut">Aucun résultat.</p>'},
cr(){const u=myu();
  const crSt = S.crStatus || { open: false, isClosed: false, inWindow: false, satDate: today(), nextOpenFri: today(), reason: '' };
  const alreadySent = S.crs.find(c => c.date === crSt.satDate && (c.uid === me.id || c.by.toLowerCase() === me.name.toLowerCase()));
  const isForced = !!crSt.isForceOpen;
  const isManuallyClosed = !!crSt.isClosed;
  const founderCard = can('founder') ? `
<div class="card" style="border:1px solid rgba(76,201,240,.4);background:linear-gradient(135deg,rgba(76,201,240,.12),rgba(58,134,255,.06));margin-bottom:18px">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:22px">👑</span>
        <b style="font-size:17px;color:var(--acc)">Gestion Fondateur – Comptes rendus</b>
        ${isForced ? '<span class="tag" style="background:rgba(255,183,3,.2);color:#ffb703;border:1px solid rgba(255,183,3,.4)">⚡ Forcé ouvert</span>' :
          (isManuallyClosed ? '<span class="tag no">🔒 Clôturé manuellement</span>' :
          (crSt.open ? '<span class="tag ok">🟢 Ouvert (Automatique)</span>' : '<span class="tag" style="background:rgba(76,201,240,.15);color:var(--acc);border:1px solid rgba(76,201,240,.3)">⏳ Fermé (Automatique - Ouvre ven. 23h59)</span>'))}
      </div>
      <p class="mut" style="margin:4px 0 0;font-size:14px">

        ${isForced ? 'Les comptes rendus sont <b style="color:#ffb703">actuellement forcés ouverts</b> hors créneau. Clique sur « Réinitialiser » pour revenir au cycle normal.' :
          (isManuallyClosed ? 'Les comptes rendus sont <b style="color:var(--bad)">clôturés</b>. Le classement officiel a été figé.' :
          (crSt.open ? 'Les comptes rendus sont <b style="color:var(--ok)">ouverts</b> selon le cycle automatique.' :
          'Le site ouvrira les comptes rendus <b style="color:var(--acc)">tout seul</b> le <b>vendredi à 23h59</b>.'))}
      </p>
    </div>
    <div class="acts" style="margin:0;gap:8px;flex-wrap:wrap">
      ${!crSt.open ? `<button type="button" class="ghost" onclick="reopenCrDay()">🔓 Ouvrir manuellement</button>` : ''}
      ${crSt.open ? `<button type="button" style="background:linear-gradient(135deg,#e63946,#d90429);color:#fff" onclick="closeCrDay()">🔒 Fermer et actualiser</button>` : ''}
      <button type="button" class="ghost" style="border:1px solid rgba(76,201,240,.5);color:var(--acc)" onclick="resetCrDay()" title="Remet le statut en automatique sans forcer l'ouverture ni la fermeture">🔄 Réinitialiser (Automatique)</button>
    </div>
  </div>
</div>` : '';

  let statusBanner = '';
  if (!crSt.open) {
    if (crSt.isClosed) {
      statusBanner = `<div class="card" style="border-left:4px solid var(--bad);background:rgba(230,57,70,.08);margin-bottom:16px"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:26px">🔒</span><div><b style="color:var(--bad)">Comptes rendus clôturés</b><p class="mut" style="margin:2px 0 0;font-size:14px">Les comptes rendus pour le <b>samedi ${fd(crSt.satDate)}</b> sont désormais clôturés par la direction. Le classement a été actualisé et reste figé jusqu'au samedi suivant.</p></div></div></div>`;
    } else {
      statusBanner = `<div class="card" style="border-left:4px solid var(--acc);background:rgba(76,201,240,.08);margin-bottom:16px"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:26px">⏳</span><div><b style="color:var(--acc)">Dépôt des comptes rendus actuellement fermé</b><p class="mut" style="margin:2px 0 0;font-size:14px">Les comptes rendus sont à rendre une fois par semaine, le samedi. L'option de dépôt ouvre chaque <b>vendredi à 23h59</b>.<br>Prochaine ouverture : <b>vendredi ${fd(crSt.nextOpenFri)} à 23h59</b>.</p></div></div></div>`;
    }
  } else if (alreadySent && !can('founder')) {
    statusBanner = `<div class="card" style="border-left:4px solid var(--ok);background:rgba(46,184,114,.08);margin-bottom:16px"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:26px">✅</span><div><b style="color:var(--ok)">Compte rendu validé pour cette semaine</b><p class="mut" style="margin:2px 0 0;font-size:14px">Tu as déjà soumis ton compte rendu pour la session du <b>samedi ${fd(crSt.satDate)}</b> (<b>${alreadySent.total} pts</b>). Le classement sera mis à jour à la clôture samedi soir.</p></div></div></div>`;
  } else {
    statusBanner = `<div class="card" style="border-left:4px solid var(--ok);background:rgba(46,184,114,.08);margin-bottom:16px"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:26px">📝</span><div><b style="color:var(--ok)">Dépôt des comptes rendus ouvert</b><p class="mut" style="margin:2px 0 0;font-size:14px">Session du <b>samedi ${fd(crSt.satDate)}</b> (à rendre une fois par semaine). Remplis le formulaire ci-dessous. Le classement restera figé jusqu'à la clôture.</p></div></div></div>`;
  }

  const submitBtn = !crSt.open ?
    `<button type="button" disabled style="opacity:.6;cursor:not-allowed">🔒 Comptes rendus fermés (ouverture vendredi 23h59)</button>` :
    (alreadySent && !can('founder') ?
      `<button type="button" disabled style="opacity:.6;cursor:not-allowed">✅ Compte rendu déjà envoyé pour cette semaine</button>` :
      `<button>Envoyer le compte rendu</button>`);

  const secMap = new Map();
  (S.cfg.stats || []).forEach((x, i) => {
    const st = getSecTitle(x.s);
    if (!secMap.has(st)) secMap.set(st, []);
    secMap.get(st).push({ x, i });
  });

  let secIdx = 0;
  let dynamicSections = '';
  for (const [st, items] of secMap.entries()) {
    const flds = items.map(({ x, i }) => {
      if (x.rec && !me.rec) return '';
      return `<label>${x.e && !x.e.startsWith('<') ? e(x.e) + ' ' : ''}${e(x.l)} <span id="pts_lbl_${i}" class="mut" style="font-size:12px;font-weight:600">(${x.p} pts/u)</span><input type="number" name="s${i}" min="0" step="any" value="0"></label>`;
    }).filter(Boolean).join('');
    dynamicSections += `<h3>${e(st)}</h3>${flds}`;
    if (secIdx === 0) {
      dynamicSections += `<div class="row"><label>Autres activités effectuées<input name="ot"></label><label>Points accordés<input type="number" name="op" step="any" value="0"></label></div>`;
    }
    secIdx++;
  }

function getSecTitle(s){return (!s || s === 'main' || /^principale?$/i.test(s)) ? 'Activité principale' : ((s === 'sec' || /^secondaire?$/i.test(s)) ? 'Activité secondaire' : s)}
function getTaskPoints(x, i, usName){
  const us = (S.cfg.unitScales || []).find(u => u.name === usName);
  if (us && us.overrides) {
    const ov = us.overrides.find(o => (o.l && (x.l.toLowerCase() === o.l.toLowerCase() || x.l.toLowerCase().includes(o.l.toLowerCase()))) || o.idx === i);
    if (ov && ov.p != null) return Number(ov.p);
  }
  return x.p;
}
function onScaleChange(f){
  const usName = f.unitScale ? f.unitScale.value : '';
  const us = (S.cfg.unitScales || []).find(u => u.name === usName);
  (S.cfg.stats || []).forEach((x, i) => {
    const el = document.getElementById('pts_lbl_' + i);
    if (el) {
      const p = getTaskPoints(x, i, usName);
      el.innerHTML = (us && p !== x.p) ? `<span style="color:var(--acc);font-weight:700">(${p} pts/u ⚡)</span>` : `(${p} pts/u)`;
    }
  });
  calc(f);
}
function formatUnitScales(scales){
  if (!scales || !scales.length) return '# Unité Navale\nNombre de grab bataillon réalisés | 8\nNombre de grab RC réalisés | 12\n\n# Unité Prison School\nNombre de jail réalisés | 8\nNombre de jail top 5 réalisés | 12';
  return scales.map(u => '# ' + u.name + '\n' + (u.overrides || []).map(o => (o.l || (S.cfg.stats[o.idx] ? S.cfg.stats[o.idx].l : 'Activité ' + o.idx)) + ' | ' + o.p).join('\n')).join('\n\n');
}
function calc(f){
  const d = new FormData(f), usName = d.get('unitScale') || '';
  let t = 0;
  S.cfg.stats.forEach((x, i) => {
    if (d.has('s' + i)) t += (Number(d.get('s' + i)) || 0) * getTaskPoints(x, i, usName);
  });
  const op = Number(d.get('op')) || 0, m = miss(myu());
  $('#tot').innerHTML = `Total estimé : <b>${r2(t + op + m)} points</b> (stats ${r2(t)}, autres activités ${op}, missions données ${m}).` + (usName ? ` <span class="tag" style="background:rgba(76,201,240,.15);color:var(--acc);margin-left:8px">📐 Barème : ${e(usName)}</span>` : '');
}

function addCr(ev){ev.preventDefault();const f=new FormData(ev.target);act('POST','cr',{pseudo:f.get('pseudo'),did:f.get('did'),unitScale:f.get('unitScale')||'',vals:S.cfg.stats.map((x,i)=>f.get('s'+i)||0),ot:f.get('ot'),op:f.get('op'),prob:f.get('prob'),amel:f.get('amel'),ping:f.get('ping'),shib:f.get('shib'),tt:f.get('tt')}).then(j=>{if(j)toast('Compte rendu envoyé : '+j.total+' points')})}
async function grade(ev){ev.preventDefault();const f=new FormData(ev.target),z=S.cfg.quizzes.find(x=>x.id==qid),j=await api('POST','quiz',{id:qid,a:z.q.map((q,i)=>Number(f.get('q'+i)))});if(j)$('#res').textContent='Score : '+j.score+'/'+z.q.length+(j.score==z.q.length?'. Parfait.':'. Relis les tutoriels ou le règlement et réessaie.')}
async function testHook(k){const url=$('#h_'+k).value.trim();if(!url){toast('Colle d’abord l’adresse du webhook');return}const j=await api('POST','hook-test',{k,url});if(j)toast(j.ok?'Message de test envoyé':'Discord a refusé cette adresse')}
function saveCfg(ev){ev.preventDefault();const f=new FormData(ev.target);
 const lines=t=>String(t).split('\n').map(l=>l.trim()).filter(Boolean),cols=l=>l.split('|').map(x=>x.trim()),L=t=>t.split(';').map(o=>o.trim()).filter(Boolean),
 blocks=t=>{const o=[];let c=null;for(const l of String(t).split('\n')){if(l.startsWith('# ')){c={t:l.slice(2).trim(),l:[]};o.push(c)}else if(c&&l.trim())c.l.push(l.trim())}return o};
 const rankThreads={};document.querySelectorAll('.rank-thread').forEach(inp=>{const rk=inp.getAttribute('data-rank'),val=inp.value.trim();if(rk&&val)rankThreads[rk]=val});
 const parsedStats = lines(f.get('stats')).map(cols).map(p => {
   const cat = (p[0] || '').trim() || 'Activité principale';
   return { s: cat, e: p[1] || '', l: p[2] || '', p: Number(String(p[3]).replace(',', '.')) || 0, rec: /rec|oui/i.test(p[4] || '') };
 });
 const parsedUnitScales = blocks(f.get('unitScales')).map(b => ({
   name: b.t.trim(),
   overrides: b.l.map(cols).map(p => {
     const actQuery = p[0].trim();
     const pts = Number(String(p[1]).replace(',', '.')) || 0;
     const foundIdx = parsedStats.findIndex(s => s.l.toLowerCase() === actQuery.toLowerCase() || s.l.toLowerCase().includes(actQuery.toLowerCase()));
     return { l: actQuery, idx: foundIdx >= 0 ? foundIdx : 0, p: pts };
   }).filter(o => o.l)
 })).filter(u => u.name);
 act('PUT','config',{name:f.get('n'),crPing:f.get('ping'),pingRoles:String(f.get('proles')).split(/\s+/).filter(Boolean),home:f.get('home'),reset:{on:!!f.get('rson'),tz:f.get('rstz')},hooks:Object.fromEntries(['rc','acc','ref','att','forma','formaRef','formaRappel','cr','bak','base'].map(k=>[k,$('#h_'+k)?$('#h_'+k).value.trim():''])),rankThreads,
  ranks:lines(f.get('ranks')),perm:{hg:$('#p_hg').value,dec:$('#p2_dec').value,pts:$('#p_pts').value,set:$('#p_set').value},rq:lines(f.get('rq')),
  stats:parsedStats,
  unitScales:parsedUnitScales,
  quizzes:blocks(f.get('quizzes')).map(z=>({t:z.t,q:z.l.map(cols).map(p=>[p[0],L(p[1]||''),(parseInt(p[2])||1)-1])})),
  tutos:blocks(f.get('tutos')).map(z=>({t:z.t,b:z.l.join('\n')}))},'Réglages enregistrés')}
function backupNow(){api('POST','backup-now',{}).then(j=>j&&toast('Sauvegarde envoyée dans le salon'))}
function resetNow(){conf('rz',()=>act('POST','reset-now',{},'Points remis à zéro'))}
function restore(){const f=$('#rf').files[0];if(!f){toast('Choisis un fichier de sauvegarde');return}conf('rs',async()=>{const j=await api('POST','restore',{data:await f.text()});if(j){S=null;me=null;render();toast('Sauvegarde restaurée : reconnecte-toi')}})}
async function setDecision(id,d){const lbl={up:'Rank up',stagne:'Stagne',derank:'Derank'};if(!confirm(`Confirmer la décision « ${lbl[d]} » pour ce compte rendu ?\nUn message sera envoyé dans le salon Discord.`))return;await act('POST','cr/'+id+'/decision',{d},'Décision « '+lbl[d]+' » envoyée sur Discord !')}
async function closeCrDay(){if(!confirm('Es-tu sûr de vouloir clôturer les comptes rendus de cette semaine ?\n\n• Le classement hebdomadaire sera immédiatement actualisé et restera figé jusqu’au samedi d’après.\n• La liste des membres n’ayant pas rendu leur compte rendu sera envoyée sur Discord.'))return;const j=await act('POST','cr/close-day',{},'Comptes rendus clôturés et classement actualisé !');if(j&&j.missingCount!=null)toast(`Clôturé : ${j.missingCount} retardataire(s) notifié(s) sur Discord`)}
async function reopenCrDay(){if(!confirm('Réouvrir les comptes rendus pour cette session ?'))return;await act('POST','cr/reopen-day',{},'Comptes rendus réouverts')}
async function resetCrDay(){
  if(!confirm('Réinitialiser le statut des comptes rendus en mode automatique ?\n\n• Annule l’ouverture forcée et la clôture manuelle.\n• Le site gérera l’ouverture tout seul (chaque vendredi à 23h59 jusqu’au samedi).'))return;
  const crSt = S.crStatus || {};
  const currentSessionCrs = (S.crs || []).filter(c => c.date === crSt.satDate);
  let clearCrs = false;
  if (currentSessionCrs.length > 0) {
    clearCrs = confirm(`Il y a ${currentSessionCrs.length} compte(s) rendu(s) déjà enregistré(s) pour la session du samedi ${fd(crSt.satDate)}.\n\nSouhaites-tu également effacer ces comptes rendus de test pour repartir à zéro ?\n(Clique sur "Annuler" pour les conserver)`);
  }
  const j = await act('POST', 'cr/reset-day', { clearCrs }, 'Statut des comptes rendus réinitialisé en mode automatique !');
  if (j && j.removedCrs) toast(`${j.removedCrs} compte(s) rendu(s) effacé(s)`);
}
function cp(t){navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Copié'),()=>toast('Copie impossible'))}
async function bulk(ev){ev.preventDefault();const f=new FormData(ev.target),j=await act('POST','points-bulk',{v:Number(f.get('v')),w:f.get('w'),ranks:f.getAll('rk'),ids:f.getAll('id')});if(j)toast(j.n+' membre(s) ont reçu les points')}
async function upMedia(){const f=$('#mf').files[0];if(!f){toast('Choisis un fichier');return}if(f.size>15e6){toast('Fichier trop lourd (15 Mo maximum)');return}
 const d=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(f)});
 const j=await act('POST','media',{name:f.name,data:d});if(j)toast('Média ajouté : copie sa ligne dans la liste')}
function delMedia(id){conf(id,()=>act('DELETE','media/'+id))}
function schedulePoll(){clearTimeout(pollT);if(!me)return;pollT=setTimeout(poll,15000)}
async function poll(){if(!me)return;const act=document.activeElement,typing=act&&/INPUT|TEXTAREA|SELECT/.test(act.tagName);
 if(document.hidden||typing||page=='set'||(page=='cr'&&act&&act.closest('form'))||(page=='quiz'&&qid)){schedulePoll();return}
 const before=JSON.stringify(S);await api('GET','state',null,1);if(S&&JSON.stringify(S)!==before)render();schedulePoll()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)poll()});
(async()=>{await api('GET','state',null,1);render();schedulePoll()})();
</script></body></html>
