<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GSS – Espace de gestion</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d16;--sidebar:rgba(13,20,36,.88);--card:rgba(18,29,51,.68);--hdr:rgba(13,20,36,.85);--ink:#f1f7fc;--mut:#94a8be;--line:rgba(148,163,184,.14);--acc:#38bdf8;--acc2:#6366f1;--fg:#ffffff;--warn:#fbbf24;--bad:#f87171;--ok:#34d399;--in:rgba(10,16,30,.75);--sh:0 12px 32px rgba(0,0,0,.32)}
@media(prefers-color-scheme:light){:root{--bg:#f4f7fb;--sidebar:rgba(255,255,255,.94);--card:rgba(255,255,255,.9);--hdr:rgba(244,247,251,.9);--ink:#0f172a;--mut:#64748b;--line:rgba(148,163,184,.25);--acc:#0284c7;--acc2:#4f46e5;--fg:#fff;--warn:#d97706;--bad:#dc2626;--ok:#059669;--in:#ffffff;--sh:0 10px 28px rgba(15,23,42,.08)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.6 Figtree,system-ui,sans-serif;background:radial-gradient(1000px 600px at 90% -10%,rgba(56,189,248,.18),transparent 65%),radial-gradient(900px 600px at -10% 20%,rgba(99,102,241,.15),transparent 60%),var(--bg);background-attachment:fixed}

/* Layout latéral */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:var(--sidebar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:10}
.side-brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.side-brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 14px rgba(56,189,248,.35)}
.side-brand .b-name{font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.side-brand .b-sub{font-size:12px;color:var(--mut)}
.side-nav{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.side-nav::-webkit-scrollbar{display:none}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;color:var(--mut);border:1px solid transparent;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:none;transition:all .15s ease}
.side-nav button:hover{color:var(--ink);background:rgba(56,189,248,.08);transform:translateX(2px)}
.side-nav button.on{color:var(--ink);background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(99,102,241,.12));border-color:rgba(56,189,248,.35);font-weight:700;box-shadow:0 4px 12px rgba(56,189,248,.1)}
.side-user{padding:14px 14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:rgba(10,16,30,.25)}
.user-row{display:flex;align-items:center;gap:10px}
.user-av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.user-meta{flex:1;min-width:0}
.user-meta .u-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main-content{flex:1;min-width:0;display:flex;flex-direction:column}
.mobile-hdr{display:none}
main{max-width:920px;width:100%;margin:0 auto;padding:28px 24px 80px;animation:rise .3s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main{animation:none}*{transition:none!important}}

/* Responsive mobile */
@media(max-width:799px){
  .app-layout{flex-direction:column}
  .sidebar{display:none}
  .mobile-hdr{position:sticky;top:0;z-index:10;display:flex;flex-direction:column;background:var(--hdr);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:10px 14px 6px}
  .mob-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:8px}
  .mob-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:100%;padding-bottom:4px}
  .mob-nav::-webkit-scrollbar{display:none}
  .mob-nav button{background:none;color:var(--mut);border:1px solid transparent;padding:6px 12px;border-radius:99px;white-space:nowrap;box-shadow:none;font-size:13px}
  .mob-nav button.on{color:var(--ink);background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.35);font-weight:700}
  main{padding:18px 14px 60px}
}

/* UI Elements */
h1,h2,h3{letter-spacing:-.02em}h2{margin:.2em 0 .8em;font-size:26px;font-weight:700}h3{margin:1.2em 0 .6em;font-size:16px;color:var(--acc);font-weight:600}
button{font:inherit;font-weight:600;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--fg);border:0;border-radius:10px;padding:9px 18px;cursor:pointer;transition:transform .12s ease,box-shadow .15s ease,filter .15s ease;box-shadow:0 4px 14px rgba(56,189,248,.25)}
button:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 18px rgba(56,189,248,.35)}button:active{transform:none}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}button.ghost:hover{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.3)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--in);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.15);outline:none}
label{display:block;margin:0 0 14px;color:var(--mut);font-size:14px;font-weight:500}label input,label select,label textarea{margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:0 0 16px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .15s}
.card:hover{border-color:rgba(56,189,248,.22)}
.row{display:flex;gap:12px;align-items:flex-end}.row>*{flex:1}.row button{flex:0 0 auto;margin-bottom:14px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts select{width:auto}
.mut{color:var(--mut)}.pre{white-space:pre-wrap;word-break:break-word}code{background:var(--in);padding:3px 8px;border-radius:8px;font-size:13px;word-break:break-all;border:1px solid var(--line)}
details summary{cursor:pointer;font-weight:600}details>*:not(summary){margin-top:10px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--in);display:inline-flex;align-items:center;gap:4px}
.tag.ok{color:var(--ok);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.tag.no{color:var(--bad);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.tag.attente,.tag.form{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.tag.rank{color:var(--acc);border-color:rgba(56,189,248,.35);background:rgba(56,189,248,.08)}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 28px;border-radius:20px;border:1px solid rgba(56,189,248,.25);background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(99,102,241,.12));margin-bottom:18px;box-shadow:var(--sh)}
.hero:after{content:'🛡️';position:absolute;right:10px;top:-10px;font-size:130px;opacity:.06;pointer-events:none}
.hero h1{margin:.1em 0;font-size:32px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0}
.pts{text-align:center;z-index:1;background:rgba(10,16,30,.4);padding:12px 20px;border-radius:16px;border:1px solid rgba(56,189,248,.2)}
.pts b{display:block;font-size:40px;font-weight:800;line-height:1;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.pts span{color:var(--mut);font-size:13px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);transition:transform .12s ease}
.stats div:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.25)}
.stats i{font-style:normal;font-size:22px}
.stats b{display:block;font-size:26px;font-weight:800;line-height:1.2;margin:4px 0}
.stats span{color:var(--mut);font-size:13px}
.note{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:12px 16px;background:var(--card)}
.flash{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.2)}
.log{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
fieldset{border:0;padding:0;margin:0 0 14px}legend{font-weight:700;margin-bottom:6px}.opt{display:flex;gap:8px;align-items:center;margin:0 0 6px;color:var(--ink);cursor:pointer}.opt input{width:auto;margin:0}
.chip{padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--in);margin:0;font-size:13px}
.rich img,.rich video{max-width:100%;border-radius:12px;display:block;margin:8px 0}.rich iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.rich figure{margin:12px 0}.rich figcaption{font-size:13px}.rich p{margin:.4em 0}.rich a{color:var(--acc)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;max-width:none;margin:0}
.glass{width:100%;max-width:390px;text-align:center;background:var(--card);border:1px solid rgba(56,189,248,.25);border-radius:24px;padding:34px 26px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.glass h1{margin:.1em 0;font-size:28px}
.glass label{text-align:left}
.glass button{width:100%;margin-top:10px;padding:12px}
.bad{color:var(--bad)}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(15,23,42,.95);color:var(--ink);border:1px solid var(--acc);padding:10px 22px;border-radius:99px;box-shadow:0 12px 36px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:99;font-weight:600;font-size:14px}#t.on{opacity:1}
@media(max-width:560px){.row{flex-direction:column;align-items:stretch}.row button{margin-bottom:0}.hero{flex-direction:column;align-items:flex-start}}
</style></head>
<body><div id="app"></div><div id="t" role="status"></div>
<script id="main">
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),r2=x=>Math.round(x*100)/100;
const today=()=>new Date().toISOString().slice(0,10),fd=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'')};
const VL={attente:'En attente',ok:'Acceptée',no:'Refusée'},LT={pts:'Points',ent:'Entretiens',dec:'Décisions',forma:'Formations',cr:'Comptes rendus',cpt:'Comptes',quiz:'Quiz',cfg:'Réglages'};
const NAV=[['dash','Accueil','🏠'],['lb','Classement','🏆'],['rc','Recrutement','📋'],['team','Profils','👥'],['cr','Comptes rendus','📊'],['quiz','Quiz','🎓'],['logs','Logs','🧾'],['tuto','Tutoriels','📖'],['set','Réglages','⚙️']];
let S=null,me=null,page='dash',rcf='',lf='',pend=null,fm=null,qid=null,flash=null,pollT=null,q='';
const can=k=>k=='founder'?!!(me&&me.p&&me.p.founder):(me&&me.p&&me.p[k]),tot=u=>r2(u.pts.reduce((s,p)=>s+p.v,0)),miss=u=>r2(u.pts.filter(p=>p.t=='mission'&&!p.rep).reduce((s,p)=>s+p.v,0)),myu=()=>S.users.find(u=>u.id==me.id);
const show={rc:()=>me.rec||can('hg')||can('dec'),logs:()=>can('hg'),set:()=>can('set')};
const warns=()=>(S.warn||[]).map(w=>`<div class="note">⚠️ ${e(w)}</div><p></p>`).join('');
const okU=u=>/^(\/media\/[0-9a-f]{16}\.\w+|https:\/\/[^\s"'<>]+)$/.test(u);
const yt=u=>{const m=/^https:\/\/(?:www\.)?(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/.exec(u);return m&&m[1]};
function rich(t){return String(t||'').split('\n').map(l=>{l=l.trim();if(!l)return'';let m;
 if(m=/^(image|video|lien)\s*:\s*(\S+)(?:\s*\|\s*(.*))?$/i.exec(l)){const k=m[1].toLowerCase(),u=m[2],cap=m[3]?`<figcaption class="mut">${e(m[3])}</figcaption>`:'';
  if(!okU(u))return`<p class="mut">Lien non autorisé : ${e(u)}</p>`;
  if(k=='image')return`<figure><img loading="lazy" src="${e(u)}" alt="${e(m[3]||'')}">${cap}</figure>`;
  if(k=='lien')return`<p><a href="${e(u)}" target="_blank" rel="noopener noreferrer">${e(m[3]||u)}</a></p>`;
  const y=yt(u);return`<figure>${y?`<iframe src="https://www.youtube-nocookie.com/embed/${y}" allowfullscreen loading="lazy" referrerpolicy="no-referrer"></iframe>`:`<video controls preload="metadata" src="${e(u)}"></video>`}${cap}</figure>`}
 if(l.startsWith('## '))return`<h3>${e(l.slice(3))}</h3>`;return`<p>${e(l)}</p>`}).join('')}
const mt=v=>!q||String(v??'').toLowerCase().includes(q.toLowerCase());
function onSearch(inp){q=inp.value;const l=document.querySelector('.search-list');if(l&&PAGES[page+'_list'])l.innerHTML=PAGES[page+'_list']();else render()}
const SB=(ph)=>`<div class="card" style="padding:10px 14px"><input type="search" value="${e(q)}" placeholder="${e(ph)}" oninput="onSearch(this)"></div>`;
const tut=l=>{const t=S.cfg.tutos.find(x=>x.t.toLowerCase()==l.toLowerCase());return t?`<details class="card"><summary>Tutoriel : ${e(t.t)}</summary><div class="rich">${rich(t.b)}</div></details>`:''};
async function api(m,u,b,q){try{const r=await fetch('/api/'+u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json','x-ads':'1'},body:b?JSON.stringify(b):undefined}),j=await r.json();if(!r.ok){if(!q)toast(j.error||'Erreur');return null}if(j.S){S=j.S;me=j.me}return j}catch(x){if(!q)toast('Serveur injoignable');return null}}
function toast(m){const t=$('#t');t.textContent=m;t.className='on';clearTimeout(toast.k);toast.k=setTimeout(()=>t.className='',4000)}
async function login(ev){ev.preventDefault();const j=await api('POST','login',{code:$('#code').value.trim()},1);if(!j){$('#err').textContent='Code inconnu ou trop d’essais.';return}render();schedulePoll()}
async function logout(){clearTimeout(pollT);await api('POST','logout',{},1);S=null;me=null;flash=null;render()}
function go(p){page=p;fm=null;qid=null;flash=null;q='';render()}
async function act(m,u,b,ok){const j=await api(m,u,b);if(j){if(j.newCode)flash=j.newCode;render();if(ok)toast(ok)}return j}

const rcRow=r=>`<div class="card"><div class="top"><b>${e(r.cand)}</b><span class="mut">${e(r.did)}</span><span class="tag ${r.v}">${VL[r.v]}</span>${r.v=='ok'&&!r.tr?'<span class="tag form">En attente de formation</span>':''}${r.tr?'<span class="tag ok">Formé</span>':''}</div>
<p class="mut">Le ${fd(r.date)}. Réalisé par ${e(r.by)}, supervisé par ${e(r.sup||'-')}.</p>
<details><summary>Voir l’entretien</summary>${(r.a||[]).map(x=>x[0]=='##'?`<h3>${e(x[1])}</h3>`:`<p><b>${e(x[0])}</b><br>${e(x[1]||'-')}</p>`).join('')}</details>
${r.tr?`<p class="mut">Formé par ${e(r.trBy)}. ${e(r.trNote||'')}</p>`:''}
<div class="acts">${can('hg')||can('dec')?`<button onclick="verd('${r.id}','ok')">Accepter</button><button class="ghost" onclick="verd('${r.id}','attente')">Mettre en attente</button><button class="ghost" onclick="verd('${r.id}','no')">Refuser</button>`:''}${can('hg')?`<button class="ghost" onclick="delRc('${r.id}')">Supprimer</button>`:''}${r.v=='ok'&&!r.tr?`<button class="ghost" onclick="fm='${r.id}';render()">Formation terminée</button>`:''}</div>
${fm==r.id?`<form onsubmit="doTrain(event,'${r.id}')"><label>Remarques sur la formation<textarea name="n" rows="2"></textarea></label><button>Envoyer le rapport de formation</button></form>`:''}</div>`;

const uCard=u=>`<div class="card"><div class="top"><b>${e(u.name)}</b><span class="tag rank">${e(u.rank)}</span>${u.rec?'<span class="tag">Recruteur</span>':''}<span class="tag">${tot(u)} pts</span></div>
${can('set')?`<div class="acts"><select onchange="setRank('${u.id}',this.value)">${S.cfg.ranks.map(r=>`<option${r==u.rank?' selected':''}>${e(r)}</option>`).join('')}</select><button class="ghost" onclick="newCode('${u.id}')">Nouveau code</button><button class="ghost" onclick="togRec('${u.id}')">Recruteur : ${u.rec?'retirer':'ajouter'}</button><button class="ghost" onclick="delU('${u.id}')">Supprimer</button></div>`:''}
${can('pts')?`<form class="row" onsubmit="addP(event,'${u.id}')"><label>Points (négatif pour retirer)<input name="v" type="number" step="any" required></label><label>Motif ou mission<input name="w" required></label><button>Ajouter</button></form>`:''}
${(u.weeks||[]).length?`<p class="mut">Semaines précédentes : ${u.weeks.slice(0,6).map(w=>fd(w.d)+' : '+w.t+' pts').join(', ')}</p>`:''}
${Object.keys(u.qz||{}).length?`<p class="mut">Quiz : ${Object.entries(u.qz).map(([k,v])=>e((S.cfg.quizzes.find(z=>z.id==k)||{t:k}).t)+' '+v).join(', ')}</p>`:''}
<ul>${u.pts.slice().reverse().slice(0,30).map(p=>`<li>${p.v>0?'+':''}${p.v} : ${e(p.w)} <span class="mut">(${e(p.by||'-')}, ${new Date(p.d).toLocaleDateString('fr-FR')})</span></li>`).join('')||'<li class="mut">Aucun point pour le moment.</li>'}</ul></div>`;

const PAGES={
dash(){const w=S.rcs.filter(r=>r.v=='attente').length,f=S.rcs.filter(r=>r.v=='ok'&&!r.tr);
 return `${warns()}<div class="hero"><div><span class="mut">Bienvenue</span><h1>${e(me.name)}</h1><p class="mut">${e(S.cfg.name)}</p></div><div class="pts"><b>${tot(myu())}</b><span>points</span></div></div>
${S.cfg.home?`<div class="card rich">${rich(S.cfg.home)}</div>`:''}${tut('Accueil')}
<div class="stats">${can('hg')||can('dec')?`<div><i>📥</i><b>${w}</b><span>candidatures en attente</span></div><div><i>🎓</i><b>${f.length}</b><span>en attente de formation</span></div>`:''}<div><i>📝</i><b>${S.crs.length}</b><span>comptes rendus</span></div><div><i>🏅</i><b>${e(me.rank)}</b><span>ton rang</span></div></div>
${(can('hg')||can('dec'))&&f.length?`<div class="note">En attente de formation : ${f.map(r=>e(r.cand)).join(', ')}</div><p></p>`:''}<p class="note">Le compte rendu est obligatoire chaque samedi avant 22h00, sous peine de sanction.${S.cfg.reset&&S.cfg.reset.on?' Les points du profil repartent à 0 chaque dimanche à 00h00 (fin du samedi, heure de '+e(S.cfg.reset.tz)+').':''}</p>`},
rc(){const today=new Date().toISOString().slice(0,10);let i=0;
 const qs=S.cfg.rq.map((l,j)=>l.startsWith('##')?`<h3>${e(l.replace(/^#+\s*/,''))}</h3>`:`<label>Question ${++i} : ${e(l)}<textarea name="a${j}" rows="2" placeholder="Réponse"></textarea></label>`).join('');
 return `<h2>Recrutement</h2>${tut('Recrutement')}<form class="card" onsubmit="addRc(event)"><h3>Nouvel entretien</h3><div class="row"><label>Candidat (pseudo)<input name="cand" required></label><label>ID Discord<input name="did" inputmode="numeric"></label></div><div class="row"><label>Date de l’entretien<input type="date" name="date" value="${today}"></label><label>Réalisé par<input name="by" value="${e(me.name)}"></label></div><label>Supervisé par<input name="sup"></label>${qs}<button>Enregistrer et envoyer le rapport d’entretien</button></form>
<div class="acts">${[['','Toutes'],['attente','En attente'],['ok','Acceptées'],['no','Refusées']].map(f=>`<button class="${rcf==f[0]?'':'ghost'}" onclick="rcf='${f[0]}';render()">${f[1]}</button>`).join('')}</div><p></p>${SB('Rechercher un candidat, un ID, un recruteur…')}<div class="search-list">${PAGES.rc_list()}</div>`},
rc_list(){return S.rcs.filter(r=>!rcf||r.v==rcf).filter(r=>mt(r.cand)||mt(r.did)||mt(r.by)||mt(r.sup)).map(rcRow).join('')||'<p class="mut">Aucun résultat.</p>'},

function newCode(id){act('POST','users/'+id+'/code',{},'Nouveau code généré')}
function togRec(id){act('POST','users/'+id+'/rec',{})}
function setRank(id,rank){act('POST','users/'+id+'/rank',{rank}).then(j=>{if(!j)render()})}
function addU(ev){ev.preventDefault();const f=new FormData(ev.target);act('POST','users',{n:f.get('n'),did:f.get('did'),rank:f.get('rank'),code:f.get('code'),rec:!!f.get('rec')},'Compte créé')}
function addP(ev,id){ev.preventDefault();const f=new FormData(ev.target);act('POST','users/'+id+'/points',{v:Number(f.get('v')),w:f.get('w')},'Points ajoutés')}
function addCr(ev){ev.preventDefault();const f=new FormData(ev.target);act('POST','cr',{pseudo:f.get('pseudo'),did:f.get('did'),vals:S.cfg.stats.map((x,i)=>f.get('s'+i)||0),ot:f.get('ot'),op:f.get('op'),prob:f.get('prob'),amel:f.get('amel'),ping:f.get('ping'),shib:f.get('shib'),tt:f.get('tt')}).then(j=>{if(j)toast('Compte rendu envoyé : '+j.total+' points')})}
async function grade(ev){ev.preventDefault();const f=new FormData(ev.target),z=S.cfg.quizzes.find(x=>x.id==qid),j=await api('POST','quiz',{id:qid,a:z.q.map((q,i)=>Number(f.get('q'+i)))});if(j)$('#res').textContent='Score : '+j.score+'/'+z.q.length+(j.score==z.q.length?'. Parfait.':'. Relis les tutoriels ou le règlement et réessaie.')}
async function testHook(k){const url=$('#h_'+k).value.trim();if(!url){toast('Colle d’abord l’adresse du webhook');return}const j=await api('POST','hook-test',{k,url});if(j)toast(j.ok?'Message de test envoyé':'Discord a refusé cette adresse')}
function saveCfg(ev){ev.preventDefault();const f=new FormData(ev.target);
 const lines=t=>String(t).split('\n').map(l=>l.trim()).filter(Boolean),cols=l=>l.split('|').map(x=>x.trim()),L=t=>t.split(';').map(o=>o.trim()).filter(Boolean),
 blocks=t=>{const o=[];let c=null;for(const l of String(t).split('\n')){if(l.startsWith('# ')){c={t:l.slice(2).trim(),l:[]};o.push(c)}else if(c&&l.trim())c.l.push(l.trim())}return o};
 const rankThreads={};document.querySelectorAll('.rank-thread').forEach(inp=>{const rk=inp.getAttribute('data-rank'),val=inp.value.trim();if(rk&&val)rankThreads[rk]=val});
 act('PUT','config',{name:f.get('n'),crPing:f.get('ping'),pingRoles:String(f.get('proles')).split(/\s+/).filter(Boolean),home:f.get('home'),reset:{on:!!f.get('rson'),tz:f.get('rstz')},hooks:Object.fromEntries(['rc','acc','ref','att','forma','cr','bak','base'].map(k=>[k,$('#h_'+k).value.trim()])),rankThreads,
  ranks:lines(f.get('ranks')),perm:{hg:$('#p_hg').value,dec:$('#p2_dec').value,pts:$('#p_pts').value,set:$('#p_set').value},rq:lines(f.get('rq')),
  stats:lines(f.get('stats')).map(cols).map(p=>({s:/^sec/i.test(p[0])?'sec':'main',e:p[1]||'',l:p[2]||'',p:Number(String(p[3]).replace(',','.'))||0,rec:/rec|oui/i.test(p[4]||'')})),
  quizzes:blocks(f.get('quizzes')).map(z=>({t:z.t,q:z.l.map(cols).map(p=>[p[0],L(p[1]||''),(parseInt(p[2])||1)-1])})),
  tutos:blocks(f.get('tutos')).map(z=>({t:z.t,b:z.l.join('\n')}))},'Réglages enregistrés')}
function backupNow(){api('POST','backup-now',{}).then(j=>j&&toast('Sauvegarde envoyée dans le salon'))}
function resetNow(){conf('rz',()=>act('POST','reset-now',{},'Points remis à zéro'))}
function restore(){const f=$('#rf').files[0];if(!f){toast('Choisis un fichier de sauvegarde');return}conf('rs',async()=>{const j=await api('POST','restore',{data:await f.text()});if(j){S=null;me=null;render();toast('Sauvegarde restaurée : reconnecte-toi')}})}
async function setDecision(id,d){const lbl={up:'Rank up',stagne:'Stagne',derank:'Derank'};if(!confirm(`Confirmer la décision « ${lbl[d]} » pour ce compte rendu ?\nUn message sera envoyé dans le salon Discord.`))return;await act('POST','cr/'+id+'/decision',{d},'Décision « '+lbl[d]+' » envoyée sur Discord !')}
async function closeCrDay(){if(!confirm('Es-tu sûr de vouloir fermer les comptes rendus pour aujourd’hui ?\n\n• Le classement de la semaine sera immédiatement mis à jour.\n• Un embed avec la liste des membres n’ayant pas rendu leur CR sera envoyé sur Discord.'))return;const j=await act('POST','cr/close-day',{},'Comptes rendus clôturés et rapport envoyé sur Discord !');if(j&&j.missingCount!=null)toast(`Clôturé : ${j.missingCount} retardataire(s) notifié(s) sur Discord`)}
async function reopenCrDay(){if(!confirm('Réouvrir les comptes rendus pour aujourd’hui ?'))return;await act('POST','cr/reopen-day',{},'Comptes rendus réouverts pour aujourd’hui')}
function cp(t){navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Copié'),()=>toast('Copie impossible'))}
async function bulk(ev){ev.preventDefault();const f=new FormData(ev.target),j=await act('POST','points-bulk',{v:Number(f.get('v')),w:f.get('w'),ranks:f.getAll('rk'),ids:f.getAll('id')});if(j)toast(j.n+' membre(s) ont reçu les points')}
async function upMedia(){const f=$('#mf').files[0];if(!f){toast('Choisis un fichier');return}if(f.size>15e6){toast('Fichier trop lourd (15 Mo maximum)');return}
 const d=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(f)});
 const j=await act('POST','media',{name:f.name,data:d});if(j)toast('Média ajouté : copie sa ligne dans la liste')}
function delMedia(id){conf(id,()=>act('DELETE','media/'+id))}
function schedulePoll(){clearTimeout(pollT);if(!me)return;pollT=setTimeout(poll,15000)}
async function poll(){if(!me)return;const act=document.activeElement,typing=act&&/INPUT|TEXTAREA|SELECT/.test(act.tagName);
 if(document.hidden||typing||page=='set'||(page=='cr'&&act&&act.closest('form'))||(page=='quiz'&&qid)){schedulePoll();return}
 const before=JSON.stringify(S);await api('GET','state',null,1);if(S&&JSON.stringify(S)!==before)render();schedulePoll()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)poll()});
(async()=>{await api('GET','state',null,1);render();schedulePoll()})();
</script></body></html>
