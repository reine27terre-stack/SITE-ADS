<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shieldShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#090d16" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background squircle matching .logo -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
  <!-- Security Shield 🛡️ -->
  <g filter="url(#shadow)">
    <!-- Shield Outer Shell -->
    <path d="M 64 22 L 96 34 C 96 70 82 96 64 106 C 46 96 32 70 32 34 Z" fill="url(#shieldShade)"/>
    <!-- Cyan Accent Contour -->
    <path d="M 64 34 L 86 42 C 86 68 76 86 64 94 C 52 86 42 68 42 42 Z" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Star Crest -->
    <path d="M 64 47 L 67.5 56.5 L 77.5 56.5 L 69.5 62 L 72.5 71.5 L 64 66 L 55.5 71.5 L 58.5 62 L 50.5 56.5 L 60.5 56.5 Z" fill="#6366f1"/>
  </g>
</svg>